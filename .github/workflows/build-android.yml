name: 🎴 Ronda - Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install \
            @capacitor/core@6.2.0 \
            @capacitor/android@6.2.0 \
            @capacitor/cli@6.2.0 \
            @capacitor/app@6.0.0 \
            @capacitor/browser@6.0.0 \
            @capacitor/haptics@6.0.0 \
            @capacitor/ios@6.2.0 \
            @capacitor/keyboard@6.0.0 \
            @capacitor/network@6.0.0 \
            @capacitor/splash-screen@6.0.0 \
            @capacitor/status-bar@6.0.0 \
            @capacitor-community/admob@6.0.0 \
            --save --legacy-peer-deps

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Set version & SDK
        run: |
          # [API36] اكبح تحذير AAR metadata الناتج عن compileSdk(35) < targetSdk(36).
          # هذا التحذير غير مؤذٍ (targetSdk أعلى من compileSdk تهيئة مدعومة)، لكن دونه
          # قد يفشل فحص CheckAarMetadata. العلم يجعله تحذيراً بدل خطأ يوقف البناء.
          GP="android/gradle.properties"
          if ! grep -q "android.suppressUnsupportedCompileSdk" "$GP" 2>/dev/null; then
            echo "android.suppressUnsupportedCompileSdk=35,36" >> "$GP"
            echo "✓ أُضيف suppressUnsupportedCompileSdk إلى gradle.properties"
          fi
          # [VERSIONCODE-FIX] versionCode مشتق من الطابع الزمني (دقائق منذ 2024) بدل
          # رقم تشغيل GitHub. السبب: عند إعادة إنشاء المستودع يعود عداد GitHub إلى 1
          # فيهبط versionCode تحت الإصدار المنشور (301) ويرفضه Google Play. الطابع
          # الزمني يتزايد دائماً ويبقى أعلى من أي إصدار سابق (يبدأ من ~880000+).
          MINUTES_SINCE=$(( ($(date +%s) - 1704067200) / 60 ))
          VERSION_CODE=$MINUTES_SINCE
          VERSION_NAME="2.0.${{ github.run_number }}"
          BUILD_GRADLE="android/app/build.gradle"
          VARS_GRADLE="android/variables.gradle"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" "$BUILD_GRADLE"
          sed -i 's/versionName "[^"]*"/versionName "'"$VERSION_NAME"'"/' "$BUILD_GRADLE"
          # [API36] targetSdk=36 مطلوب من Google Play (31 أغسطس 2026) — مجرد opt-in
          # للسلوك، لا يتطلب رموز compile جديدة. compileSdk يبقى 35 لأن Capacitor 6
          # (CapacitorWebView.java) يستعمل رموز API 35؛ رفع compileSdk لـ36 يفرض
          # AGP 8.9.1+ الذي قد يكسر بناء Capacitor 6/AdMob. الفصل مدعوم رسمياً.
          # ⚠️ يجب تغطية المصدرين: بعض تهيئات Capacitor تضع القيم في variables.gradle
          # وأخرى مباشرة في app/build.gradle. تغطية واحد فقط تُنتج حزمة بـ35 بصمت.
          if [ -f "$VARS_GRADLE" ]; then
            sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 24/" "$VARS_GRADLE"
            sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 35/" "$VARS_GRADLE"
            sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" "$VARS_GRADLE"
            echo "=== variables.gradle بعد التعديل ===" && cat "$VARS_GRADLE"
          else
            echo "⚠️ variables.gradle غير موجود — سيُضبط SDK في app/build.gradle"
          fi
          # اضبط أي قيم صريحة في app/build.gradle (تتجاوز variables.gradle إن وُجدت)
          sed -i "s/targetSdkVersion rootProject\.ext\.targetSdkVersion/targetSdkVersion 36/" "$BUILD_GRADLE" 2>/dev/null || true
          sed -i "s/targetSdkVersion [0-9]\+/targetSdkVersion 36/" "$BUILD_GRADLE" 2>/dev/null || true
          sed -i "s/targetSdk = [0-9]\+/targetSdk = 36/" "$BUILD_GRADLE" 2>/dev/null || true
          echo "=== app/build.gradle (android block) ==="
          grep -E "SdkVersion|targetSdk|compileSdk|versionCode|versionName" "$BUILD_GRADLE" || true
          # [API36-GUARD] تحقُّق صارم على المصدر الفعلي: أوقف البناء إن ظهرت أي 35
          # كهدف في أي من الملفين، أو إن لم يُعثر على 36 في أيهما. يمنع إنتاج حزمة
          # مرفوضة من Google Play بصمت ويكشف الخلل فوراً في سجل البناء.
          FOUND36=0
          for F in "$VARS_GRADLE" "$BUILD_GRADLE"; do
            [ -f "$F" ] || continue
            if grep -Eq 'targetSdk(Version)?\s*=?\s*36' "$F"; then FOUND36=1; fi
            if grep -Eq 'targetSdk(Version)?\s*=?\s*3[0-5]\b' "$F"; then
              echo "::error::$F يحتوي targetSdk أقل من 36 — البناء متوقف"
              grep -nE 'targetSdk(Version)?\s*=?\s*[0-9]+' "$F"
              exit 1
            fi
          done
          if [ "$FOUND36" != "1" ]; then
            echo "::error::لم يُعثر على targetSdk=36 في أي ملف Gradle — البناء متوقف"
            exit 1
          fi
          echo "✅ [API36-GUARD] تأكيد targetSdk=36 في مصدر Gradle الفعلي"
          # [MINSDK-GUARD] ميزة "الحماية التلقائية" في Google Play ترفض أي حزمة
          # بـ minSdk أقل من 24. أوقف البناء هنا بدل اكتشاف الرفض عند الرفع.
          BADMIN=0
          for F in "$VARS_GRADLE" "$BUILD_GRADLE"; do
            [ -f "$F" ] || continue
            if grep -Eq 'minSdkVersion\s*=?\s*(1[0-9]|2[0-3])\b' "$F"; then
              echo "::error::$F يحتوي minSdkVersion أقل من 24 — سترفضه الحماية التلقائية"
              grep -nE 'minSdkVersion\s*=?\s*[0-9]+' "$F"
              BADMIN=1
            fi
          done
          [ "$BADMIN" = "1" ] && exit 1
          echo "✅ [MINSDK-GUARD] تأكيد minSdkVersion ≥ 24"
          echo "📦 versionCode=$VERSION_CODE versionName=$VERSION_NAME"

      - name: Apply Android patches
        run: |
          mkdir -p android/app/src/main/res/values
          cp android-patches/strings.xml android/app/src/main/res/values/strings.xml
          mkdir -p android/app/src/main/res/xml
          cp android-patches/network_security_config.xml android/app/src/main/res/xml/
          cp android-patches/backup_rules.xml android/app/src/main/res/xml/
          cp android-patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Apply Ronda icons
        run: |
          RES="android/app/src/main/res"
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$dir"
            cp "android-patches/res/$dir/"*.png "$RES/$dir/" 2>/dev/null || true
          done

      - name: Setup keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          SECRET_KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KS_PATH="$GITHUB_WORKSPACE/release-keystore.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
            echo "✓ Keystore من secrets"
          else
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias ronda-key \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ronda2024 -keypass ronda2024 \
              -dname "CN=Ronda, O=RondaGames, L=Casablanca, C=MA" \
              -noprompt
            echo "⚠ Keystore مؤقت"
          fi
          FINAL_KS_PASS="${SECRET_KS_PASS:-ronda2024}"
          FINAL_KS_ALIAS="${SECRET_KS_ALIAS:-ronda-key}"
          ls -la "$KS_PATH"
          echo "KEYSTORE_PATH=$KS_PATH"         >> $GITHUB_ENV
          echo "KS_PASS=$FINAL_KS_PASS"         >> $GITHUB_ENV
          echo "KS_ALIAS=$FINAL_KS_ALIAS"       >> $GITHUB_ENV

      - name: Inject signing into build.gradle
        run: |
          python3 scripts/inject-signing.py \
            "$KEYSTORE_PATH" "$KS_PASS" "$KS_ALIAS"
          echo "=== build.gradle (أول 70 سطر) ==="
          head -70 android/app/build.gradle


      - name: Copy google-services.json
        run: |
          cp android-patches/google-services.json android/app/google-services.json
          echo "✓ google-services.json → android/app/"
          ls -la android/app/google-services.json

      - name: Inject Firebase into Gradle files
        run: python3 scripts/inject-firebase.py

      # [NO-SPLITS] يُعطّل تقسيم الحزمة فيسلّم Google Play حزمة واحدة كاملة.
      # يمنع نافذة "Something went wrong … try reinstalling the app" التي
      # تظهر عند وصول حزمة الأساس دون الحزم المرافقة (استعادة نسخة احتياطية،
      # نقل بين جهازين، تنزيل ناقص). لا حزم مرافقة = لا شيء ينقص.
      - name: "📦 Disable bundle splits (single-APK delivery)"
        run: |
          python3 scripts/inject-bundle-config.py
          echo "=== كتلة bundle في build.gradle ==="
          grep -A5 "bundle {" android/app/build.gradle || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
        continue-on-error: true

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      # ⚠️ لا continue-on-error هنا: AAB هو ما يُرفع لـ Google Play. إن فشل بناؤه
      # وواصل الـ workflow، قد تُرفع مخرجات قديمة من كاش البناء (بـ targetSdk 35)
      # فتُنتج حزمة مرفوضة تُبقي تحذير السياسة نشطاً.
      - name: Build Release AAB
        run: |
          cd android
          rm -rf app/build/outputs/bundle   # امسح أي AAB قديم من الكاش
          ./gradlew bundleRelease --no-daemon

      # [API36-VERIFY] التحقق النهائي من الناتج الفعلي وليس الملفات المصدرية.
      # المانيفست المدموج (merged manifest) هو ما يُكتب داخل الـ AAB بعد دمج
      # مانيفست التطبيق + كل الإضافات (AdMob/Capacitor). أي مسار تجاوز خفي
      # (uses-sdk من إضافة، دمج مانيفست، تعديل plugin) يظهر هنا فقط.
      # هذه الخطوة هي الحقيقة النهائية التي يقرؤها Google Play.
      - name: "🔍 Verify built artifact targets API 36"
        if: always()
        run: |
          cd android
          MM=$(find app/build/intermediates -name "AndroidManifest.xml" -path "*merged_manifest*" -o -name "AndroidManifest.xml" -path "*merged_manifests*" 2>/dev/null | head -1)
          if [ -z "$MM" ]; then
            echo "::warning::لم يُعثر على المانيفست المدموج — تحقق من سجل البناء"
          else
            echo "=== المانيفست المدموج: $MM ==="
            grep -o 'targetSdkVersion="[0-9]*"' "$MM" || echo "(لا uses-sdk صريح — Gradle يضبطه في AAB)"
            BAD=$(grep -o 'targetSdkVersion="[0-9]*"' "$MM" | grep -oE '[0-9]+' | head -1)
            if [ -n "$BAD" ] && [ "$BAD" -lt 36 ]; then
              echo "::error::المانيفست المدموج يستهدف $BAD — الحزمة سيرفضها Google Play!"
              exit 1
            fi
          fi
          # تحقق مباشر من الـ APK عبر aapt2 (الحقيقة المطلقة)
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -r | head -1)
          if [ -f "$APK" ] && [ -n "$AAPT" ]; then
            echo "=== aapt2 badging على الـ APK الفعلي ==="
            INFO=$("$AAPT" dump badging "$APK" 2>/dev/null | grep -E "targetSdkVersion|sdkVersion|versionCode" || true)
            echo "$INFO"
            TGT=$(echo "$INFO" | grep -oP "targetSdkVersion:'\K[0-9]+" | head -1)
            if [ -n "$TGT" ]; then
              if [ "$TGT" -lt 36 ]; then
                echo "::error::الـ APK المبني يستهدف $TGT وليس 36 — سيرفضه Google Play!"
                exit 1
              fi
              echo "✅ [API36-VERIFY] الحزمة المبنية تستهدف targetSdk=$TGT"
            fi
          fi
          echo "✅ التحقق النهائي اكتمل"

      - name: List build outputs
        if: always()
        run: |
          echo "=== كل الملفات المنتجة ==="
          find android/app/build/outputs -type f 2>/dev/null || echo "لا مخرجات"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ronda-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ronda-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: warn

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ronda-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Build Summary
        if: always()
        run: |
          # [VERSIONCODE-FIX] نفس اشتقاق الطابع الزمني المستخدم أعلاه (للعرض فقط)
          MINUTES_SINCE=$(( ($(date +%s) - 1704067200) / 60 ))
          VERSION_CODE=$MINUTES_SINCE
          VERSION_NAME="2.0.${{ github.run_number }}"
          echo "## 🎴 Ronda Build Results" >> $GITHUB_STEP_SUMMARY
          echo "**versionCode:** $VERSION_CODE | **versionName:** $VERSION_NAME" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in \
            "android/app/build/outputs/apk/debug/app-debug.apk|Debug APK للتصحيح" \
            "android/app/build/outputs/apk/release/app-release.apk|Release APK للإصدار" \
            "android/app/build/outputs/bundle/release/app-release.aab|AAB متجر جوجل بلاي"; do
            FILE="${f%%|*}"; LABEL="${f##*|}"
            if [ -f "$FILE" ]; then
              echo "✅ **$LABEL:** $(du -sh $FILE | cut -f1)" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **$LABEL:** لم يُنشأ" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "📥 حمّل من **Artifacts** أعلى الصفحة" >> $GITHUB_STEP_SUMMARY
